<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TiAmo Relaxation Spa Payout System</title>

<script src="https://cdn.jsdelivr.net/npm/html2canvas"></script>

<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;700&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Poppins,sans-serif;
    background:#000;
    color:#fff;
}

.container{
    max-width:1100px;
    margin:auto;
    padding:30px;
    text-align:center;
    position:relative;
}

h1,h2,h3,h4{
    font-family:'Playfair Display',serif;
    color:#d4af37;
}

button{
    padding:12px 20px;
    margin:8px;
    border:none;
    border-radius:25px;
    background:#d4af37;
    color:#000;
    cursor:pointer;
    transition:.3s;
    font-weight:600;
}

button:hover{
    transform:translateY(-2px);
    box-shadow:0 5px 15px rgba(212,175,55,.4);
}

.card{
    background:#111;
    padding:20px;
    margin-top:20px;
    border-radius:15px;
    border:1px solid rgba(212,175,55,.2);
    position:relative;
    overflow:hidden;
}

.card:hover{
    box-shadow:0 0 30px rgba(212,175,55,.4);
}

.hidden{
    display:none;
}

input,
select,
textarea{
    padding:10px;
    margin:5px;
    border-radius:8px;
    border:none;
    background:#222;
    color:#fff;
    width:100%;
}

textarea{
    min-height:90px;
    resize:vertical;
}

.section{
    border-top:1px solid #333;
    margin-top:15px;
    padding-top:15px;
}

.funding-row{
    display:flex;
    flex-wrap:wrap;
    align-items:center;
    gap:8px;
    margin-bottom:8px;
}

.funding-row input,
.funding-row select{
    flex:1;
}

.remove-btn{
    background:#c0392b;
    color:white;
    padding:8px 12px;
    font-size:0.9em;
}

.currency::before{
    content:"R ";
    font-weight:bold;
}

.summary-total{
    font-size:1.8em;
    color:#d4af37;
    font-weight:bold;
    margin:20px 0;
}

.date-header{
    font-size:1.1em;
    color:#aaa;
    margin-bottom:15px;
}

.logo{
    width:120px;
    margin-bottom:15px;
}

#summary-card{
    max-width:750px;
    margin:auto;
}

#summary p{
    margin:8px 0;
    font-size:15px;
}

.hidden{
    display:none;
}

.landing-buttons{
    margin-top:30px;
}

@media(max-width:768px){

    .funding-row{
        flex-direction:column;
    }

    button{
        width:100%;
    }

}

</style>
</head>

<body>

<div class="container">

    <img src="https://via.placeholder.com/120x60?text=TiAmo" class="logo">

    <h1>TiAmo Payout System</h1>

    <!-- LANDING PAGE -->

    <div id="start-page">

        <div class="landing-buttons">

            <button onclick="showWeekly()">
                📅 Weekly Report
            </button>

            <button onclick="showWeekend()">
                🌙 Weekend Payout Report
            </button>

            <button onclick="viewAllReports()">
                📁 View All Reports
            </button>

        </div>

    </div>

    <!-- WEEKLY REPORT -->

    <div id="weekly" class="hidden">

        <button onclick="goHome()">
            ⬅ Back
        </button>

        <h2>Weekly Report (Mon - Thurs)</h2>

        <div id="days"></div>

        <!-- ADS -->

        <div class="card">

            <h2>Ads</h2>

            <div class="items"></div>

            <button onclick="addItem(this)">
                + Add Ads Entry
            </button>

        </div>

        <!-- PENALTIES -->

        <div class="card">

            <h2>Penalties</h2>

            <div class="items"></div>

            <button onclick="addItem(this)">
                + Add Penalty
            </button>

        </div>

        <!-- LEVY -->

        <div class="card">

            <h2>Levy</h2>

            <div class="items"></div>

            <button onclick="addItem(this)">
                + Add Levy
            </button>

        </div>

        <!-- SUMMARY -->

        <div class="card" id="summary-card">

            <h2>Overall Summary</h2>

            <div id="date-header" class="date-header"></div>

            <div id="summary" class="section"></div>

        </div>

        <button onclick="downloadSummaryPNG()">
            📸 Download Summary PNG
        </button>

    </div>

    <!-- WEEKEND REPORT -->

    <div id="weekend" class="hidden">

        <button onclick="goHome()">
            ⬅ Back
        </button>

        <h2>Weekend Payout Report (Fri - Sun)</h2>

        <div id="weekend-days"></div>

        <div class="card" id="weekend-summary-card">

            <h2>Weekend Summary</h2>

            <div id="weekend-date-header" class="date-header"></div>

            <div id="weekend-summary" class="section"></div>

        </div>

        <button onclick="downloadWeekendPNG()">
            📸 Download Weekend Summary PNG
        </button>

    </div>

    <!-- VIEW ALL -->

    <div id="allReports" class="hidden">

        <button onclick="goHome()">
            ⬅ Back
        </button>

        <h2>All Past Reports</h2>

        <div id="report-history"></div>

    </div>

</div>

<script>

const weeklyDays =
["Monday","Tuesday","Wednesday","Thursday"];

const weekendDays =
["Friday","Saturday","Sunday"];

const daysContainer =
document.getElementById('days');

const weekendContainer =
document.getElementById('weekend-days');

function showWeekly(){

    document.getElementById('start-page')
    .classList.add('hidden');

    document.getElementById('weekly')
    .classList.remove('hidden');

    document.getElementById('weekend')
    .classList.add('hidden');

    document.getElementById('allReports')
    .classList.add('hidden');
}

function showWeekend(){

    document.getElementById('start-page')
    .classList.add('hidden');

    document.getElementById('weekly')
    .classList.add('hidden');

    document.getElementById('weekend')
    .classList.remove('hidden');

    document.getElementById('allReports')
    .classList.add('hidden');
}

function viewAllReports(){

    document.getElementById('start-page')
    .classList.add('hidden');

    document.getElementById('weekly')
    .classList.add('hidden');

    document.getElementById('weekend')
    .classList.add('hidden');

    document.getElementById('allReports')
    .classList.remove('hidden');

    loadHistory();
}

function goHome(){

    document.getElementById('start-page')
    .classList.remove('hidden');

    document.getElementById('weekly')
    .classList.add('hidden');

    document.getElementById('weekend')
    .classList.add('hidden');

    document.getElementById('allReports')
    .classList.add('hidden');
}

function createDay(day){

    const div = document.createElement('div');

    div.className = 'card';

    div.innerHTML = `

        <h3>${day}</h3>

        <input type="date">

        <div class="section">

            <label>
                Total Amount Needed To Pay Therapists
            </label>

            <input
            type="number"
            class="amount-input"
            placeholder="ZAR 0.00"
            oninput="calculateSummary()">

        </div>

        <div class="section">

            <label>
                Total Amount Counted In Envelope
            </label>

            <input
            type="number"
            class="amount-input"
            placeholder="ZAR 0.00"
            oninput="calculateSummary()">

        </div>

        <div class="section">

            <label>
                Additional Funds In Envelope
            </label>

            <select onchange="calculateSummary()">

                <option value="ZAR">
                    ZAR
                </option>

            </select>

            <input
            type="number"
            class="amount-input"
            placeholder="ZAR 0.00"
            oninput="calculateSummary()">

        </div>

        <div class="section">

            <label>
                Total Amount Short In Envelope
            </label>

            <input
            type="number"
            class="amount-input"
            placeholder="ZAR 0.00"
            oninput="calculateSummary()">

        </div>

        <div class="section">

            <h4>
                Funds Added
            </h4>

            <div class="funding-sources"></div>

            <button onclick="addFundingSource(this)">
                + Add Funding Source
            </button>

        </div>
    `;

    const fundingContainer =
    div.querySelector('.funding-sources');

    addDefaultFundingRow(fundingContainer);

    return div;
}

function addDefaultFundingRow(container){

    const row = document.createElement('div');

    row.className = 'funding-row';

    row.innerHTML = `

        <select onchange="toggleOther(this)">

            <option value="Ewallet">
                Ewallet
            </option>

            <option value="ATM">
                ATM
            </option>

            <option value="Other">
                Other
            </option>

        </select>

        <input
        class="otherInput hidden"
        placeholder="Specify Other Source">

        <input
        type="number"
        placeholder="ZAR 0.00"
        class="amount-input"
        oninput="calculateSummary()">

        <button
        class="remove-btn"
        onclick="removeFunding(this)">
            ×
        </button>
    `;

    container.appendChild(row);
}

function addFundingSource(btn){

    const container =
    btn.previousElementSibling;

    addDefaultFundingRow(container);
}

function removeFunding(btn){

    btn.parentElement.remove();

    calculateSummary();
}

function toggleOther(select){

    const otherInput =
    select.parentElement.querySelector('.otherInput');

    if(select.value === 'Other'){

        otherInput.classList.remove('hidden');

    }else{

        otherInput.classList.add('hidden');
    }
}

function addItem(btn){

    const container =
    btn.previousElementSibling;

    const div =
    document.createElement('div');

    div.className = 'funding-row';

    div.innerHTML = `

        <input
        type="text"
        placeholder="Description">

        <input
        type="number"
        placeholder="ZAR 0.00"
        class="amount-input"
        oninput="calculateSummary()">

        <button
        class="remove-btn"
        onclick="removeFunding(this)">
            ×
        </button>
    `;

    container.appendChild(div);
}

function calculateSummary(){

    const now = new Date();

    const dateStr =
    now.toLocaleDateString('en-ZA', {

        weekday:'long',
        year:'numeric',
        month:'long',
        day:'numeric'

    });

    document.getElementById('date-header')
    .innerHTML =
    `<strong>Report Date:</strong> ${dateStr}`;

    let totalNeeded = 0;
    let totalEnvelope = 0;
    let totalAdditional = 0;
    let totalShort = 0;
    let totalFundsAdded = 0;
    let totalPenalties = 0;

    document.querySelectorAll('#days .card')
    .forEach(card => {

        const inputs =
        card.querySelectorAll('.amount-input');

        if(inputs.length >= 4){

            totalNeeded +=
            parseFloat(inputs[0].value) || 0;

            totalEnvelope +=
            parseFloat(inputs[1].value) || 0;

            totalAdditional +=
            parseFloat(inputs[2].value) || 0;

            totalShort +=
            parseFloat(inputs[3].value) || 0;
        }
    });

    document.querySelectorAll('.funding-row .amount-input')
    .forEach(input => {

        totalFundsAdded +=
        parseFloat(input.value) || 0;

    });

    document.querySelectorAll('.items .amount-input')
    .forEach(input => {

        totalPenalties +=
        parseFloat(input.value) || 0;

    });

    const grandTotalShortage =
    totalShort + totalPenalties;

    document.getElementById('summary')
    .innerHTML = `

        <p>
        <strong>
        Total Needed To Pay Therapists:
        </strong>
        <span class="currency">
        ${totalNeeded.toFixed(2)}
        </span>
        </p>

        <p>
        <strong>
        Total Counted In Envelopes:
        </strong>
        <span class="currency">
        ${totalEnvelope.toFixed(2)}
        </span>
        </p>

        <p>
        <strong>
        Additional Funds In Envelope:
        </strong>
        <span class="currency">
        ${totalAdditional.toFixed(2)}
        </span>
        </p>

        <p>
        <strong>
        Total Shortage:
        </strong>
        <span class="currency">
        ${totalShort.toFixed(2)}
        </span>
        </p>

        <p>
        <strong>
        Total Funds Added:
        </strong>
        <span class="currency">
        ${totalFundsAdded.toFixed(2)}
        </span>
        </p>

        <p>
        <strong>
        Total Penalties / Ads / Levy:
        </strong>
        <span class="currency">
        ${totalPenalties.toFixed(2)}
        </span>
        </p>

        <p class="summary-total">

        GRAND TOTAL SHORTAGE:

        <span class="currency">
        ${grandTotalShortage.toFixed(2)}
        </span>

        </p>
    `;
}

async function downloadSummaryPNG(){

    const summaryCard =
    document.getElementById('summary-card');

    const wrapper =
    document.createElement('div');

    wrapper.style.width = '794px';

    wrapper.style.padding = '20px';

    wrapper.style.background = '#111';

    wrapper.style.position = 'absolute';

    wrapper.style.left = '-99999px';

    wrapper.style.top = '0';

    const clone =
    summaryCard.cloneNode(true);

    clone.style.width = '100%';

    clone.style.margin = '0';

    clone.style.boxShadow = 'none';

    clone.style.border =
    '1px solid rgba(212,175,55,.2)';

    clone.style.padding = '20px';

    wrapper.appendChild(clone);

    document.body.appendChild(wrapper);

    const canvas = await html2canvas(wrapper,{

        scale:2,
        backgroundColor:'#111',
        width:wrapper.offsetWidth,
        height:wrapper.offsetHeight

    });

    const link =
    document.createElement('a');

    link.download =
    `tiamo-summary-${new Date()
    .toISOString()
    .slice(0,10)}.png`;

    link.href =
    canvas.toDataURL('image/png');

    link.click();

    document.body.removeChild(wrapper);

    saveReport();
}

async function downloadWeekendPNG(){

    const summaryCard =
    document.getElementById('weekend-summary-card');

    const canvas = await html2canvas(summaryCard,{
        scale:2,
        backgroundColor:'#111'
    });

    const link =
    document.createElement('a');

    link.download =
    `weekend-summary-${new Date()
    .toISOString()
    .slice(0,10)}.png`;

    link.href =
    canvas.toDataURL('image/png');

    link.click();

    saveReport();
}

function saveReport(){

    const reports =
    JSON.parse(
        localStorage.getItem('tiamoReports')
    ) || [];

    reports.push({

        date:new Date().toLocaleDateString(),

        created:new Date().toLocaleString()

    });

    localStorage.setItem(
        'tiamoReports',
        JSON.stringify(reports)
    );
}

function loadHistory(){

    const container =
    document.getElementById('report-history');

    container.innerHTML = '';

    const reports =
    JSON.parse(
        localStorage.getItem('tiamoReports')
    ) || [];

    if(reports.length === 0){

        container.innerHTML = `

        <div class="card">

            <h3>
                No Reports Saved Yet
            </h3>

        </div>
        `;

        return;
    }

    reports.reverse().forEach(report => {

        const div =
        document.createElement('div');

        div.className = 'card';

        div.innerHTML = `

            <h3>
                Saved Report
            </h3>

            <p>
                ${report.date}
            </p>

            <p>
                ${report.created}
            </p>
        `;

        container.appendChild(div);
    });
}

/* INITIALIZE */

weeklyDays.forEach(day => {

    daysContainer.appendChild(
        createDay(day)
    );

});

weekendDays.forEach(day => {

    weekendContainer.appendChild(
        createDay(day)
    );

});

calculateSummary();

</script>

</body>
</html>
