<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>TiAmo Relaxation Spa Payout System</title>
<script src="https://cdn.jsdelivr.net/npm/html2canvas"></script>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;700&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:Poppins,sans-serif;background:#000;color:#fff}
.container{max-width:1000px;margin:auto;padding:30px;text-align:center;position:relative}
h1,h2{font-family:'Playfair Display',serif;color:#d4af37}
button{padding:12px 20px;margin:8px;border:none;border-radius:25px;background:#d4af37;color:#000;cursor:pointer;transition:.3s}
button:hover{transform:translateY(-2px);box-shadow:0 5px 15px rgba(212,175,55,.4)}
.card{background:#111;padding:20px;margin-top:20px;border-radius:15px;border:1px solid rgba(212,175,55,.2);position:relative;overflow:hidden;}
.card:hover{box-shadow:0 0 30px rgba(212,175,55,.7); border:1px solid rgba(212,175,55,.8);}
.hidden{display:none}
input,select{padding:10px;margin:5px;border-radius:8px;border:none;background:#222;color:#fff}
.section{border-top:1px solid #333;margin-top:15px;padding-top:10px}
.funding-row { display:flex; flex-wrap:wrap; align-items:center; gap:8px; margin-bottom:8px; }
.funding-row input, .funding-row select { flex:1; min-width:160px; }
.remove-btn { background:#c0392b; color:white; padding:8px 12px; font-size:0.9em; }
.currency::before { content: "R "; font-weight: bold; }
.summary-total { font-size:1.5em; color:#d4af37; font-weight:bold; margin:15px 0; }
.date-header { font-size:1.1em; color:#aaa; margin-bottom:15px; }
</style>
</head>
<body>
<div class="container">
<img src="https://via.placeholder.com/120x60?text=TiAmo" class="logo">
<h1>TiAmo Payout System</h1>

<div id="weekly">
<button onclick="show('start')">⬅ Back</button>
<h2>Weekly Report (Mon - Thurs)</h2>
<div id="days"></div>

<!-- Ads, Penalties, Levy Cards ... (kept as is) -->
<div class="card">
<h2>Ads</h2><div class="items"></div><button onclick="addItem(this)">+</button>
</div>
<div class="card">
<h2>Penalties (Summary)</h2><div class="items" id="global-penalties"></div><button onclick="addItem(this)">+</button>
</div>
<div class="card">
<h2>Levy</h2><div class="items"></div><button onclick="addItem(this)">+</button>
</div>

<!-- Summary Card -->
<div class="card" id="summary-card">
<h2>Overall Summary</h2>
<div id="date-header" class="date-header"></div>
<div id="summary" class="section"></div>
</div>

<button onclick="downloadSummaryPNG()">📸 Download Summary PNG</button>
</div>
</div>

<script>
const days = ["Monday","Tuesday","Wednesday","Thursday"];
const daysContainer = document.getElementById('days');

// Create Day Cards
function createDay(day) {
    const div = document.createElement('div');
    div.className = 'card';
    div.innerHTML = `
        <h3>${day}</h3>
        <input type="date">
        <div class="section">
            <label>Total amount needed to pay therapists</label><br>
            <input type="number" class="amount-input" placeholder="0.00" oninput="calculateSummary()">
        </div>
        <div class="section">
            <label>Total Amount counted in envelope</label><br>
            <input type="number" class="amount-input" placeholder="0.00" oninput="calculateSummary()">
        </div>
        <div class="section">
            <label>Total amount short in Therapist envelope</label><br>
            <input type="number" class="amount-input" placeholder="0.00" oninput="calculateSummary()">
        </div>
        <div class="section">
            <h4>Funds Added (Multiple Sources)</h4>
            <div class="funding-sources"></div>
            <button onclick="addFundingSource(this)">+ Add Funding Source</button>
        </div>
    `;

    // Add default funding row
    const fundingContainer = div.querySelector('.funding-sources');
    addDefaultFundingRow(fundingContainer);
    return div;
}

function addDefaultFundingRow(container) {
    const row = document.createElement('div');
    row.className = 'funding-row';
    row.innerHTML = `
        <select onchange="toggleOther(this)">
            <option value="Ewallet">Ewallet</option>
            <option value="ATM">ATM</option>
            <option value="Other">Other</option>
        </select>
        <input class="otherInput hidden" placeholder="Specify other source">
        <input type="number" placeholder="Amount" class="amount-input" oninput="calculateSummary()">
        <button class="remove-btn" onclick="this.parentElement.remove();calculateSummary()">×</button>
    `;
    container.appendChild(row);
}

// Add Item (Ads, Penalties, Levy)
function addItem(btn){
    const parent = btn.previousElementSibling;
    const row = document.createElement('div');
    row.style.marginBottom = "8px";
    row.innerHTML = `
        <input placeholder="Name/Description" style="width:45%">
        <input placeholder="Reason" style="width:30%">
        <input type="number" placeholder="Amount" class="amount-input" style="width:20%" oninput="calculateSummary()">
    `;
    parent.appendChild(row);
}

// Funding Sources
function addFundingSource(btn){
    const container = btn.previousElementSibling;
    addDefaultFundingRow(container);
}

function toggleOther(select){
    const otherInput = select.parentElement.querySelector('.otherInput');
    otherInput.classList.toggle('hidden', select.value !== "Other");
}

// ==================== FIXED SUMMARY ====================
function calculateSummary(){
    const now = new Date();
    const dateStr = now.toLocaleDateString('en-ZA', { weekday:'long', year:'numeric', month:'long', day:'numeric' });
    document.getElementById('date-header').innerHTML = `<strong>Report Date:</strong> ${dateStr}`;

    let totalNeeded = 0, totalEnvelope = 0, totalShort = 0;
    let totalFundsAdded = 0;
    let totalPenalties = 0;

    // Day Sections (Therapists, Envelope, Shortage)
    document.querySelectorAll('#days .card').forEach(card => {
        const inputs = card.querySelectorAll('.amount-input');
        if(inputs.length >= 3){
            totalNeeded += parseFloat(inputs[0].value) || 0;
            totalEnvelope += parseFloat(inputs[1].value) || 0;
            totalShort += parseFloat(inputs[2].value) || 0;
        }
    });

    // All Funding Sources
    document.querySelectorAll('.funding-row .amount-input').forEach(input => {
        totalFundsAdded += parseFloat(input.value) || 0;
    });

    // Ads + Penalties + Levy
    document.querySelectorAll('.items .amount-input').forEach(input => {
        totalPenalties += parseFloat(input.value) || 0;
    });

    const summaryHTML = `
        <p><strong>Total Needed to Pay Therapists:</strong> <span class="currency">${totalNeeded.toFixed(2)}</span></p>
        <p><strong>Total Counted in Envelopes:</strong> <span class="currency">${totalEnvelope.toFixed(2)}</span></p>
        <p><strong>Total Shortage:</strong> <span class="currency">${totalShort.toFixed(2)}</span></p>
        <p><strong>Total Funds Added:</strong> <span class="currency">${totalFundsAdded.toFixed(2)}</span></p>
        <p><strong>Total Penalties / Ads / Levy:</strong> <span class="currency">${totalPenalties.toFixed(2)}</span></p>
        <p class="summary-total">Grand Total Shortage: <span class="currency">${(totalShort + totalPenalties).toFixed(2)}</span></p>
    `;

    document.getElementById('summary').innerHTML = summaryHTML;
}

// Download
function downloadSummaryPNG(){
    const summaryCard = document.getElementById('summary-card');
    html2canvas(summaryCard, {scale: 2, backgroundColor: '#111'}).then(canvas => {
        const link = document.createElement('a');
        link.download = `tiamo-summary-${new Date().toISOString().slice(0,10)}.png`;
        link.href = canvas.toDataURL('image/png');
        link.click();
    });
}

function show(id){ /* your existing show function */ }

// Initialize
days.forEach(d => daysContainer.appendChild(createDay(d)));
</script>
</body>
</html>
